/**:
  ros__parameters:
    filter_target_label:
      UNKNOWN : true
      CAR : false
      TRUCK : false
      BUS : false
      TRAILER : false
      MOTORCYCLE : false
      BICYCLE : false
      PEDESTRIAN : false

    filter_settings:
      # polygon overlap based filter
      polygon_overlap_filter:
        enabled: true
      # velocity direction based filter
      lanelet_direction_filter:
        enabled: false
        velocity_yaw_threshold: 0.785398 # [rad] (45 deg)
        object_speed_threshold: 3.0 # [m/s]
      debug: false
      lanelet_extra_margin: 0.0
      use_height_threshold: false
      max_height_threshold: 10.0 # [m] from the base_link height in map frame
      min_height_threshold: -1.0 # [m] from the base_link height in map frame
      # Ignore only tiny, stationary UNKNOWN clusters such as Town01 traffic-light poles.
      # Vehicle- and pedestrian-sized UNKNOWN objects remain valid obstacles.
      tiny_unknown_filter:
        enabled: true
        max_footprint_short_side: 0.30 # [m]
        max_footprint_long_side: 0.45 # [m]
        max_speed: 0.3 # [m/s]
